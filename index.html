<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F6FA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EAT & DRINK" />
    <title>EAT &amp; DRINK — Restaurant POS (Mangalagiri)</title>
  </head>
  <body class="bg-[#F3F6FA] text-[#18202B] antialiased select-none">
    <div id="root">
      <!-- Branded Zero-Blank Pre-Loader -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F3F6FA; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="background: #ffffff; padding: 14px 20px; border-radius: 24px; border: 1px solid #D8E1EC; box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 16px; display: flex; align-items: center; justify-content: center;">
          <img src="/eat-and-drink.png" alt="EAT & DRINK" style="height: 54px; width: auto; object-fit: contain;" />
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #697586;">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #FF5B4A;"></div>
          <span>Starting EAT &amp; DRINK POS...</span>
        </div>
      </div>
    </div>
    
    <script type="module" src="/src/main.jsx"></script>
    
    <script>
      // Automatic recovery if any dynamic chunk load fails due to a new deployment
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('dynamically imported module') || e.message.includes('Loading chunk'))) {
          console.warn('[PWA] New deployment detected, refreshing application cache...');
          window.location.reload();
        }
      });

      // Register and maintain Service Worker with update listeners
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.onupdatefound = function() {
              var installing = reg.installing;
              if (installing) {
                installing.onstatechange = function() {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    installing.postMessage('SKIP_WAITING');
                  }
                };
              }
            };
          }).catch(function() {});
        });
      }
    </script>
  </body>
</html>
